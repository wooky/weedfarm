# --- Time source (SNTP) ---
time:
  - platform: sntp
    id: ${sntp_id}
    timezone: ${sntp_timezone}
    on_time: 
      - seconds: 0
        minutes: /30
        then: 
          - switch.turn_on: garden_pump
          - delay: 60s
          - switch.turn_off: garden_pump
      - seconds: 0
        minutes: '*'
        then: 
          - lambda: |-
              auto now = id(${sntp_id}).now();

              // Light ON between 09:00 and 23:00
              if (now.hour >= 9 && now.hour < 23) {
                id(garden_light).turn_on();
              } else {
                id(garden_light).turn_off();
              }

switch:
  # Light relay
  - platform: gpio
    id: garden_light
    name: "Garden Light"
    pin: ${garden_light_gpio}

  # Pump Relay on GPIO0
  - platform: gpio
    id: garden_pump
    name: "Garden Pump"
    pin: ${garden_pump_gpio}

substitutions:
  sntp_id: sntp_time
  sntp_timezone: America/Edmonton
